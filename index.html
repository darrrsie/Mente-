<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf8f2">
  <meta name="description" content="Mente & Movimento: jogos leves de memória, atenção e coordenação.">
  <title>Mente & Movimento</title>
  <link rel="icon" href="./assets/icon-512.png" type="image/png">
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <a class="skip-link" href="#view">Pular para o conteúdo</a>
  <div class="app-shell">
    <header class="topbar">
      <button type="button" class="brand" data-action="home" aria-label="Ir ao início"><span class="brand-symbol" aria-hidden="true">✦</span><span>Mente <b>&</b><br>Movimento</span></button>
      <div class="topbar-right"><span id="levelChip" class="level-chip">Nível 1</span><span id="xpChip" class="xp-chip">✦ 0 XP</span><button type="button" class="accessibility-link" data-action="preferences" aria-label="Acessibilidade e preferências">Acessibilidade</button></div>
    </header>
    <p id="storageNotice" class="storage-notice" role="status" hidden></p>
    <main id="view" tabindex="-1" aria-label="Conteúdo principal"></main>
    <nav class="bottom-nav" aria-label="Navegação principal">
      <button type="button" data-action="home" data-nav="home"><span aria-hidden="true">⌂</span>Início</button>
      <button type="button" data-action="map" data-nav="map"><span aria-hidden="true">◉</span>Mapa</button>
      <button type="button" data-action="profile" data-nav="profile"><span aria-hidden="true">♙</span>Perfil</button>
    </nav>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="appDialog" aria-labelledby="dialogTitle" aria-describedby="dialogDescription">
    <form id="dialogForm" class="dialog-card" novalidate>
      <h2 id="dialogTitle"></h2><p id="dialogDescription" class="dialog-description"></p>
      <div id="dialogGuide" hidden></div>
      <div id="dialogField" class="dialog-field" hidden><label for="dialogName">Como você gostaria de ser chamado?</label><input id="dialogName" name="name" type="text" autocomplete="given-name" maxlength="24" aria-describedby="dialogError"></div>
      <p id="dialogError" class="dialog-error" role="alert"></p>
      <div class="dialog-actions"><button type="button" class="secondary-button" data-dialog="cancel">Cancelar</button><button type="submit" class="primary-button" data-dialog="confirm">Confirmar</button></div>
    </form>
  </dialog>
  <script defer src="./src/app.bundle.js"></script>
</body>
</html>
