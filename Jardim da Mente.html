<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jardim da Mente</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fffbe8;--fg:#1d2b1d;--card:#ffffff;--bd:#2e6b34;--ac:#2e7d32;--acfg:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15201a;--fg:#f4f1e0;--card:#223329;--bd:#8fd694;--ac:#4caf50;--acfg:#0b1a0e}}
:root[data-theme="dark"]{--bg:#15201a;--fg:#f4f1e0;--card:#223329;--bd:#8fd694;--ac:#4caf50;--acfg:#0b1a0e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Verdana,Arial,sans-serif;font-size:22px}
#app{max-width:720px;margin:0 auto;padding:16px;text-align:center}
h1{font-size:2em;margin:.3em 0}
p{line-height:1.4;margin:.4em 0}
button{font:inherit;color:var(--fg);background:var(--card);border:4px solid var(--bd);border-radius:20px;cursor:pointer;touch-action:manipulation}
.big{display:block;width:100%;margin:14px 0;padding:22px;font-size:1.2em;font-weight:bold}
.big small{display:block;font-weight:normal;font-size:.7em;margin-top:6px}
.back{padding:12px 22px;margin:8px 0;font-size:.85em}
.ok{background:var(--ac);color:var(--acfg);font-weight:bold;padding:16px 28px;margin:10px}
.msg{min-height:3em;font-weight:bold;font-size:1.1em}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}
.c{aspect-ratio:1;font-size:3.2em;padding:0}
.c.up{background:#fff3b0;color:#000}
.c.done{background:#c8f0c8;color:#000;border-color:#2e7d32}
#area{position:relative;height:55vh;min-height:300px;border:4px dashed var(--bd);border-radius:20px;margin:12px 0;overflow:hidden}
#bub{position:absolute;width:96px;height:96px;border-radius:50%;background:#42a5f5;border:5px solid #0d47a1;font-size:2.4em;padding:0}
.col{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.col button{height:130px;border-color:#000;color:#000;font-weight:bold;opacity:.55}
.col button.on{opacity:1;transform:scale(1.06);box-shadow:0 0 0 8px var(--fg)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const app=document.getElementById('app');
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let token=0;
const PRAISE=['Muito bem! 👏','Excelente! 🌟','Parabéns! 🎉','Isso mesmo! 😊','Que beleza! 🌼'];
const pr=()=>PRAISE[Math.floor(Math.random()*PRAISE.length)];
const back='<button class="back" onclick="menu()">⬅ Voltar ao início</button>';

function menu(){
  token++;
  app.innerHTML=`<h1>🌻 Jardim da Mente</h1>
  <p>Escolha um jogo. Não há pressa e não há tempo limite.</p>
  <button class="big" onclick="memoria()">🍎 Pares de Frutas<small>Treina a memória</small></button>
  <button class="big" onclick="bolhas()">🔵 Toque nas Bolhas<small>Treina a coordenação das mãos</small></button>
  <button class="big" onclick="cores()">🎨 Siga as Cores<small>Treina atenção e sequência</small></button>`;
}

function memoria(){
  token++;
  const F=['🍎','🍌','🍇','🍓','🍊','🍉'];
  const deck=sh([...F,...F]);
  let first=null,lock=false,found=0,tries=0;
  app.innerHTML=`<h1>🍎 Pares de Frutas</h1><p>Toque em duas cartas para achar frutas iguais.</p><div class="msg" id="m"></div><div class="grid" id="g"></div>${back}`;
  const g=document.getElementById('g'),m=document.getElementById('m');
  deck.forEach((f,i)=>{
    const b=document.createElement('button');b.className='c';b.textContent='❓';b.setAttribute('aria-label','Carta '+(i+1));
    b.onclick=async()=>{
      if(lock||b.classList.contains('up')||b.classList.contains('done'))return;
      b.textContent=f;b.classList.add('up');
      if(!first){first=b;return;}
      tries++;lock=true;
      if(first.textContent===f){
        first.className=b.className='c done';found++;m.textContent=pr();first=null;lock=false;
        if(found===6){m.innerHTML=`🏆 Você achou todos os pares em ${tries} tentativas!<br><button class="ok" onclick="memoria()">Jogar de novo</button>`;}
      }else{
        m.textContent='Quase! Tente de novo.';
        const t=token;await wait(1400);if(t!==token)return;
        first.textContent=b.textContent='❓';first.classList.remove('up');b.classList.remove('up');first=null;lock=false;
      }
    };
    g.appendChild(b);
  });
}

function bolhas(){
  token++;
  const TOTAL=8;let n=0;
  app.innerHTML=`<h1>🔵 Toque nas Bolhas</h1><p>Toque na bolha azul sempre que ela aparecer.</p><div class="msg" id="m">Bolhas estouradas: 0 de ${TOTAL}</div><div id="area"></div>${back}`;
  const area=document.getElementById('area'),m=document.getElementById('m');
  function nova(){
    const b=document.createElement('button');b.id='bub';b.textContent='🔵';b.setAttribute('aria-label','Bolha');
    b.style.left=Math.random()*(area.clientWidth-96)+'px';
    b.style.top=Math.random()*(area.clientHeight-96)+'px';
    b.onclick=()=>{
      b.remove();n++;
      if(n>=TOTAL){m.innerHTML=`🏆 Parabéns! Você estourou todas!<br><button class="ok" onclick="bolhas()">Jogar de novo</button>`;return;}
      m.textContent=pr()+' Bolhas estouradas: '+n+' de '+TOTAL;nova();
    };
    area.appendChild(b);
  }
  nova();
}

function cores(){
  token++;const t=token;
  const C=[['Vermelho','#ef5350'],['Verde','#66bb6a'],['Azul','#42a5f5'],['Amarelo','#ffee58']];
  const GOAL=6;let seq=[],pos=0,busy=true;
  app.innerHTML=`<h1>🎨 Siga as Cores</h1><p>Olhe a sequência de cores e depois repita tocando nas cores.</p><div class="msg" id="m"></div><div class="col" id="c"></div>${back}`;
  const m=document.getElementById('m'),box=document.getElementById('c');
  const btn=C.map((c,i)=>{
    const b=document.createElement('button');b.textContent=c[0];b.style.background=c[1];
    b.onclick=()=>press(i);box.appendChild(b);return b;
  });
  async function show(){
    busy=true;pos=0;m.textContent='👀 Olhe com atenção...';await wait(900);
    for(const i of seq){if(t!==token)return;btn[i].classList.add('on');await wait(800);btn[i].classList.remove('on');await wait(300);}
    if(t!==token)return;m.textContent='👆 Agora é a sua vez!';busy=false;
  }
  async function press(i){
    if(busy)return;
    btn[i].classList.add('on');setTimeout(()=>btn[i].classList.remove('on'),250);
    if(i!==seq[pos]){m.textContent='Quase! Vamos ver de novo, com calma.';await wait(1500);show();return;}
    pos++;
    if(pos===seq.length){
      if(seq.length===GOAL){busy=true;m.innerHTML=`🏆 Parabéns! Você completou ${GOAL} cores!<br><button class="ok" onclick="cores()">Jogar de novo</button>`;return;}
      busy=true;m.textContent=pr();await wait(1300);seq.push(Math.floor(Math.random()*4));show();
    }
  }
  seq.push(Math.floor(Math.random()*4));show();
}
menu();
</script>
</body>
</html>
